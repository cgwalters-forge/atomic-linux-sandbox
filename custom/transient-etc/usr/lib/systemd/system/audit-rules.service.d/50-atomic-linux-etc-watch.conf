# Transient-/etc test variant only: augenrules --load starts with -D, which
# drops the watch that atomic-linux-etc-watch.service loaded; load it again.
# Processes forked between its -a task,never and this keep no audit context.
[Service]
ExecStartPost=-/usr/bin/auditctl -R /usr/lib/atomic-linux/etc-watch.rules
